version: 0.0
# Target platform: Amazon Linux 2023 (dnf + systemd). The hook scripts
# check /etc/os-release and fail on any other distribution.
os: linux
files:
  - source: /index.html
    destination: /var/www/html/
hooks:
  BeforeInstall:
    - location: scripts/install_dependencies
      timeout: 300
      runas: root
    - location: scripts/start_server
      timeout: 300
      runas: root
  ApplicationStop:
    - location: scripts/stop_server
      timeout: 300
      runas: root

